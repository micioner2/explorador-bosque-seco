name: explorador_bosque_seco
description: >-
  Explorador digital ecoturístico del bosque seco. App offline-first para
  turistas y asociaciones (Reto 12 AIDER · Piura Innova).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.4.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
