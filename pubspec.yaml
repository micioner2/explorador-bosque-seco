name: explorador_bosque_seco
description: >-
  Explorador digital ecoturístico del bosque seco. App offline-first para
  turistas y asociaciones (Reto 12 AIDER · Piura Innova).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  # Fijada: la 7.3.2 choca con geolocator (piden versiones distintas de dbus).
  connectivity_plus: 7.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  geolocator: ^14.1.1
  go_router: ^17.4.0
  http: ^1.6.0
  # La versión de intl la fija flutter_localizations (SDK de Flutter).
  # Fijada: image 4.11.0 (que trae pdf) usa una función de archive que pdf
  # no permite instalar, y no compila.
  image: 4.10.2
  intl: any
  latlong2: ^0.10.1
  mobile_scanner: ^7.1.4
  pdf: 3.13.1
  printing: 5.14.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Mapa base de la ruta para verlo sin señal (tool/descargar_teselas.py).
    - assets/teselas/
    # Imágenes de los atractivos (ilustraciones de demostración).
    - assets/fotos/
  # Genera AppLocalizations desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true

# Ícono del launcher desde el logo de EcoRumbo (símbolo verde sobre blanco).
# Es una herramienta de desarrollo: no forma parte del APK. Las imágenes
# fuente están en assets/icono/ (no se empaquetan: esa carpeta no se declara
# arriba). Regenerar tras cambiar el logo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/icono/ecorumbo_icono.png'
  adaptive_icon_background: '#FFFFFF'
  adaptive_icon_foreground: 'assets/icono/ecorumbo_frente.png'
  remove_alpha_ios: true
