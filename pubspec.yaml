name: explorador_bosque_seco
description: >-
  Explorador digital ecoturístico del bosque seco. App offline-first para
  turistas y asociaciones (Reto 12 AIDER · Piura Innova).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.4.0
  http: ^1.6.0
  # La versión de intl la fija flutter_localizations (SDK de Flutter).
  intl: any
  mobile_scanner: ^7.1.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Genera AppLocalizations desde lib/l10n/*.arb (ver l10n.yaml).
  generate: true
