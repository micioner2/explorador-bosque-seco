name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  calidad:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato (dart format)
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::error::Hay archivos sin formatear. Ejecuta: dart format lib test"
            dart format lib test > /dev/null
            git --no-pager diff
            exit 1
          fi

      - name: Análisis estático (flutter analyze)
        run: flutter analyze

      - name: Pruebas (flutter test)
        run: flutter test --coverage

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Compilar APK de Android
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: explorador-bosque-seco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
