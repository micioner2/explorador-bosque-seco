name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  calidad:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      # Usa exactamente las versiones de pubspec.lock. Si falla, alguien
      # cambió pubspec.yaml sin subir el pubspec.lock actualizado.
      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile

      # Genera lib/l10n/app_localizations*.dart desde los .arb (español e
      # inglés). Esos archivos no se suben al repositorio.
      - name: Generar traducciones (flutter gen-l10n)
        run: flutter gen-l10n

      - name: Verificar formato (dart format)
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::error::Hay archivos sin formatear. Ejecuta: dart format lib test"
            dart format lib test > /dev/null
            {
              echo "### Cambios de formato pendientes"
              echo "Ejecuta \`dart format lib test\` y vuelve a subir."
              echo '```diff'
              git --no-pager diff
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git --no-pager diff
            exit 1
          fi

      - name: Análisis estático (flutter analyze)
        run: |
          set -o pipefail
          if ! flutter analyze 2>&1 | tee analyze.log; then
            {
              echo "### Observaciones de flutter analyze"
              echo '```'
              cat analyze.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Pruebas (flutter test)
        run: |
          set -o pipefail
          if ! flutter test --coverage 2>&1 | tee test.log; then
            {
              echo "### Pruebas con errores"
              echo '```'
              tail -n 150 test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            awk -F: '
              /^SF:/ { generado = ($2 ~ /l10n.app_localizations/) }
              !generado && /^LF:/ { lineas += $2 }
              !generado && /^LH:/ { cubiertas += $2 }
              END {
                if (lineas > 0) {
                  print "### Cobertura de pruebas"
                  print ""
                  printf "**%.1f %%** de las líneas (%d de %d), ", cubiertas * 100 / lineas, cubiertas, lineas
                  print "sin contar las traducciones generadas."
                }
              }
            ' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Compilar APK de Android
    needs: calidad
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get --enforce-lockfile

      - name: Compilar APK (release)
        run: flutter build apk --release

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: explorador-bosque-seco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
